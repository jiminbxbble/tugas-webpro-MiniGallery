<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Gallery - Tambah/Edit Memori</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-teal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Mini Gallery</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu navigasi">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link " href="index.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link " href="daftar.html">Daftar Memori</a></li>
            <li class="nav-item"><a class="nav-link active" href="form.html">Tambah Memori</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <article class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 text-teal fw-bold">Tambah / Edit Memori</h1>
            <p class="text-muted">Isi form berikut untuk menyimpan memori berharga kamu.</p>

            <form action="#" method="post" class="row g-3">
              <div class="col-12 col-md-6">
                <label for="judul" class="form-label fw-semibold text-teal">Judul Memori</label>
                <input type="text" class="form-control" id="judul" name="judul" placeholder="Contoh: Liburan ke Pantai" required>
              </div>

              <div class="col-12 col-md-6">
                <label for="tanggal" class="form-label fw-semibold text-teal">Tanggal</label>
                <input type="date" class="form-control" id="tanggal" name="tanggal" required>
              </div>

              <div class="col-12 col-md-6">
                <label for="kategori" class="form-label fw-semibold text-teal">Kategori</label>
                <select class="form-select" id="kategori" name="kategori">
                  <option value="liburan">Liburan</option>
                  <option value="keluarga">Keluarga</option>
                  <option value="momen-spesial">Momen Spesial</option>
                  <option value="lainnya">Lainnya</option>
                </select>
              </div>

              <div class="col-12 col-md-6">
                <label for="file" class="form-label fw-semibold text-teal">Unggah Foto/Video</label>
                <input type="file" class="form-control" id="file" name="file" accept="image/*,video/*">
              </div>

              <div class="col-12">
                <label for="deskripsi" class="form-label fw-semibold text-teal">Deskripsi</label>
                <textarea class="form-control" id="deskripsi" name="deskripsi" rows="4" placeholder="Ceritakan momen ini..."></textarea>
              </div>

              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-teal">Simpan Memori</button>
                <a href="daftar.html" class="btn btn-outline-secondary">Batal</a>
              </div>
            </form>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="bg-teal text-center py-3 mt-5">
    <small>&copy; 2026 Mini Gallery. Dibuat untuk menyimpan memori berharga kamu.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
