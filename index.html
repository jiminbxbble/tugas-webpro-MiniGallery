<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Gallery - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-teal">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Mini Gallery</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu navigasi">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="index.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link " href="daftar.html">Daftar Memori</a></li>
            <li class="nav-item"><a class="nav-link " href="form.html">Tambah Memori</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <article>
      <header class="mb-4 text-center">
        <h1 class="h3 text-teal fw-bold">Dashboard</h1>
        <p class="text-muted mb-0">Simpan dan nikmati kembali memori berharga kamu</p>
      </header>

      <!-- Statistik: angkanya dihitung & diisi oleh script.js -->
      <section class="row g-3 mb-4" aria-label="Ringkasan statistik">
        <div class="col-12 col-md-4">
          <div class="card text-center shadow-sm h-100"><div class="card-body">
            <p class="display-6 fw-bold text-teal mb-0" id="stat-foto">0</p>
            <p class="text-muted mb-0">Total Foto</p>
          </div></div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card text-center shadow-sm h-100"><div class="card-body">
            <p class="display-6 fw-bold text-teal mb-0" id="stat-video">0</p>
            <p class="text-muted mb-0">Total Video Singkat</p>
          </div></div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card text-center shadow-sm h-100"><div class="card-body">
            <p class="display-6 fw-bold text-teal mb-0" id="stat-kategori">0</p>
            <p class="text-muted mb-0">Kategori</p>
          </div></div>
        </div>
      </section>

      <!-- Memori terbaru: kartunya dirender oleh script.js dari array data -->
      <section aria-label="Memori terbaru">
        <h2 class="h5 text-teal fw-bold mb-3">Memori Terbaru</h2>
        <div class="row g-3" id="daftar-kartu"></div>
      </section>
    </article>
  </main>

  <footer class="bg-teal text-center py-3 mt-5">
    <small>&copy; 2026 Mini Gallery. Dibuat untuk menyimpan memori berharga kamu.</small>
  </footer>

  <!-- Urutan penting: jQuery dulu, baru script.js yang memakainya -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
